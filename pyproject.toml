[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-weighting-quantization"
version = "0.1.0"
description = "Research code for attention weighting quantization in vision-language models"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
